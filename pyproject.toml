[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ostrovok-travel-data"
version = "1.0.0"
description = "Russian travel data adapters for the O!din zapros hackathon"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "jsonschema[format]>=4.23,<5", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2", "setuptools>=77"]

[project.scripts]
travel-data = "travel_data.cli:main"

[tool.setuptools.packages.find]
include = ["travel_data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
